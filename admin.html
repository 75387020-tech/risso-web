<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador · Risso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="admin.html">Risso Admin</a>
      
      <!-- Botón menú responsivo para celulares -->
      <button class="menu-toggle" id="admin-menu-toggle" aria-label="Menú">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <nav class="nav" id="admin-nav">
        <a id="logout-btn" style="cursor:pointer; color: var(--ink); font-weight: 700;">Cerrar Sesión</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="wrap">
      <h1>Dashboard Administrador</h1>
      <p>Control total de solicitudes de proyectos a medida, cotizaciones y clientes.</p>
    </div>
  </section>

  <main class="section">
    <div class="wrap">
      <div class="panel">
        <h2>Solicitudes de Proyectos a Medida</h2>
        <p style="color: var(--muted); margin-bottom: 20px;">Datos registrados en tiempo real desde Supabase.</p>
        <div id="admin-quotes-list" style="overflow-x: auto;">
          <p class="empty">Cargando solicitudes...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p><strong>Risso</strong> · Panel de Control Exclusivo</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Toggle de menú responsivo para celulares
      const menuToggle = document.getElementById("admin-menu-toggle");
      const adminNav = document.getElementById("admin-nav");
      if (menuToggle && adminNav) {
        menuToggle.addEventListener("click", () => {
          adminNav.classList.toggle("open");
        });
      }

      // 2. Función de Cierre de Sesión
      const handleLogout = async (e) => {
        if (e) e.preventDefault();
        if (typeof supabaseClient !== 'undefined' && supabaseClient) {
          await supabaseClient.auth.signOut();
        }
        window.location.href = 'login.html';
      };

      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", handleLogout);
      }

      // 3. Verificar sesión activa en Supabase
      if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        window.location.href = 'login.html';
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (!profile || profile.role !== 'admin') {
        alert("Acceso denegado. Se requiere cuenta de Administrador.");
        window.location.href = 'cliente.html';
        return;
      }

      // 4. Cargar lista de cotizaciones ordenando por 'created_at' (columna correcta de Supabase)
      const container = document.getElementById("admin-quotes-list");
      const { data: quotes, error } = await supabaseClient
        .from('proyectos_medida')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<p class="empty">Error al cargar datos de Supabase: ' + error.message + '</p>';
        return;
      }

      if (!quotes || !quotes.length) {
        container.innerHTML = '<p class="empty">No hay solicitudes registradas aún.</p>';
        return;
      }

      // 5. Renderizar la tabla con las solicitudes en tiempo real
      container.innerHTML = `
        <table style="width:100%; border-collapse: collapse; text-align: left; font-size: 14px;">
          <thead>
            <tr style="border-bottom: 2px solid var(--surface-border);">
              <th style="padding: 10px;">Fecha</th>
              <th style="padding: 10px;">Nombre</th>
              <th style="padding: 10px;">Ambiente</th>
              <th style="padding: 10px;">Detalle</th>
              <th style="padding: 10px;">Acción WhatsApp</th>
            </tr>
          </thead>
          <tbody>
            ${quotes.map(q => `
              <tr style="border-bottom: 1px solid var(--surface-border);">
                <td style="padding: 12px 10px;">${q.created_at ? new Date(q.created_at).toLocaleDateString() : 'N/D'}</td>
                <td style="padding: 12px 10px; font-weight:700;">${q.nombre || ''}</td>
                <td style="padding: 12px 10px;">${q.ambiente || ''}</td>
                <td style="padding: 12px 10px; color:var(--muted);">${q.detalle || ''}</td>
                <td style="padding: 12px 10px;">
                  <a href="https://wa.me/51918247224?text=${encodeURIComponent('Hola ' + (q.nombre || '') + ', te escribimos desde Industrias Risso respecto a tu cotización para ' + (q.ambiente || ''))}" target="_blank" class="btn btn-dark" style="height: 32px; padding: 0 12px; font-size: 12px;">Contactar</a>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    });
  </script>
</body>
</html>
