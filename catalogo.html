<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Risso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">Risso</a>
      <form class="search" data-search>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input type="search" placeholder="Buscar" aria-label="Buscar">
      </form>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menú">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="nav" id="site-nav">
        <div class="nav-catalog">
          <a class="is-active" href="catalogo.html">Catálogo</a>
          <button class="theme-toggle" id="btnTema" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro">
            <span class="theme-toggle-track" aria-hidden="true"></span>
          </button>
        </div>
        <a class="stack" href="proyectos.html">Proyectos<br>a medidas</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="inspirate.html">Inspírate</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <div class="header-actions">
        <a class="icon-btn" href="login.html" aria-label="Cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.6-3.2 4-4.8 7-4.8s5.4 1.6 7 4.8"/></svg>
        </a>
        <button class="icon-btn" onclick="location.href='catalogo.html'" aria-label="Favoritos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10z"/></svg>
          <span class="badge" id="fav-count">0</span>
        </button>
        <button class="icon-btn" id="open-cart" aria-label="Carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.5L21 8H7"/></svg>
          <span class="badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="wrap">
      <h1>Catálogo</h1>
      <p>Muebles de fabricación local para cada ambiente de tu casa u oficina.</p>
    </div>
  </section>

  <main class="section">
    <div class="wrap">
      <div class="filters">
        <button class="chip is-on" data-filter="Todos">Todos</button>
        <button class="chip" data-filter="Dormitorio">Dormitorio</button>
        <button class="chip" data-filter="Sala">Sala</button>
        <button class="chip" data-filter="Comedor">Comedor</button>
        <button class="chip" data-filter="Oficina">Oficina</button>
        <button class="chip" data-filter="Cocina">Cocina</button>
      </div>
      <div class="grid-cards" id="catalog-grid"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p><strong>Risso</strong> · Muebles fabricados en Pasco</p>
      <p>Catálogo · Proyectos a medida · Contacto</p>
    </div>
  </footer>
  <div class="drawer" id="cart-drawer" data-close-cart>
    <div class="drawer-panel" onclick="event.stopPropagation()">
      <h2>Carrito</h2>
      <div id="cart-list"></div>
      <br>
      <a class="btn btn-dark" href="contacto.html">Cotizar pedido</a>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
